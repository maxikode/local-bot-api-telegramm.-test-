services:
  - type: web
    name: local-telegram-bot-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_LOCAL
        value: "1"
      - key: TELEGRAM_HTTP_IP_ADDRESS
        value: "0.0.0.0"
      - key: TELEGRAM_HTTP_PORT
        value: "10000"
